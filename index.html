<!DOCTYPE html>
<html>
  <head>
    <title>Flute Fingering Charts — Baroque Flute, Transverse Flute, Piccolo</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google-site-verification" content="wuE1-fQKojC3-t2ik3od7LeK65eqJRALmye5Gqegv9s" />
    <meta
      name="description"
      content="Free fingering charts for the 1-key baroque traverso, modern transverse flute, and piccolo — every fingering drawn as it appears on the instrument, with historical sources."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:opsz@8..72&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Restores the route encoded by public/404.html's redirect.
      (function () {
        var search = window.location.search;
        if (search.indexOf('?p=') === -1) return;
        var params = new URLSearchParams(search.slice(1));
        var path = params.get('p');
        var q = params.get('q');
        window.history.replaceState(
          null,
          '',
          window.location.pathname.replace(/\/$/, '') +
            (path ? '/' + path : '') +
            (q ? '?' + q.replace(/~and~/g, '&') : '') +
            window.location.hash
        );
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
